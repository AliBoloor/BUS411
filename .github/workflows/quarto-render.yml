name: Render Quarto Website

on:
  push:
    branches: [main, master]

concurrency:
  group: quarto-render-${{ github.workflow }}-${{ github.ref }}
  # Let each push finish; cancelling leaves docs/ stale when pushes are close together.
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use Node 24 for JS-based actions (checkout, setup-python, etc.); see
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: "1.9.37"
          # HTML-only in CI; run `quarto render` locally to refresh PDFs in docs/.
          tinytex: false

      - name: Report Quarto version
        run: quarto --version

      - name: Setup Python for Quarto execution
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib pandas ipykernel jupyter
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Render website (HTML only)
        run: quarto render --to html

      - name: Commit and push docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff --staged --quiet || git commit -m "Render Quarto website to docs/"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push
