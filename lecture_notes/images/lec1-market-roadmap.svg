<text class="heading" x="800" y="888">CONSTRUCT / RESHAPE EXPOSURE</text><text x="800" y="923">Bond portfolios · Futures · Swaps · Options</text>
<path class="flow" d="M650 945 V973 H440 V995"/><path class="flow" d="M950 945 V973 H1160 V995"/>
