<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1150" viewBox="0 0 2200 1150" role="img" aria-labelledby="title desc">
<title id="title">Fixed income: funding, information and risk</title>
<desc id="desc">Investors and borrowers connect through market structure at the top. Information and trading feed prices and risk, which feed back to investment value and borrowing costs. Sensitivity measurement leads to reshaping exposure for hedging or speculation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#526579"/></marker></defs>
<rect width="2200" height="1150" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#203247;text-anchor:middle;font-size:23px}.heading{font-size:26px;font-weight:bold}.small{font-size:20px}.box{stroke-width:1.5;rx:12}.flow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#526579;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style>
<text x="800" y="52" font-size="34" font-weight="bold">FIXED INCOME: FUNDING, INFORMATION &amp; RISK</text>
<rect class="box" x="85" y="125" width="365" height="220" fill="#dceaff" stroke="#7b94ba"/>
<text class="heading" x="267" y="164">INVESTORS</text><text x="267" y="204">Pensions · Insurers · Funds</text><text x="267" y="237">Banks · Households</text><text x="267" y="277">Need future payments</text><text class="small" x="267" y="315">Return · Safety · Liquidity</text>
<rect class="box" x="585" y="125" width="430" height="220" fill="#e6e8ed" stroke="#8b9bab"/>
