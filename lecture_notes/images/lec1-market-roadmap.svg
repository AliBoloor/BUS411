<text class="heading" x="440" y="1036">HEDGE: OFFSET EXISTING RISK</text><text class="small" x="440" y="1070">Example: own bonds + sell appropriately sized bond futures</text>
<rect class="box" x="850" y="1000" width="620" height="90" fill="#e7dfcd" stroke="#9b8bb8"/>
<text class="heading" x="1160" y="1036">SPECULATE: TAKE A VIEW</text><text class="small" x="1160" y="1070">Example: buy fixed-rate bonds expecting yields to fall</text>
<text class="small" x="800" y="1128">The whole position determines the purpose. Risk is transferred—not erased. Examples hold other factors constant.</text>
