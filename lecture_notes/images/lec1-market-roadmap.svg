<rect class="box" x="85" y="480" width="365" height="160" fill="#fff0bf" stroke="#b5a26a"/>
<text class="heading" x="267" y="518">INFORMATION</text><text x="267" y="555">Policy · Inflation · Outlook</text><text x="267" y="590">Borrower financial health</text><text class="small" x="267" y="622">News changes expectations</text>
<path class="flow" d="M450 560 H575"/>
<rect class="box" x="580" y="475" width="440" height="170" fill="#ffdccc" stroke="#b5a26a"/>
<text class="heading" x="800" y="514">PRICES, YIELDS &amp; RISK</text><text x="800" y="555">Interest rates · Credit</text><text x="800" y="590">Liquidity · Embedded options</text><text class="small" x="800" y="625">Fixed payments ≠ fixed value</text>
<path class="feedback" d="M650 475 V402 H267 V350"/>
