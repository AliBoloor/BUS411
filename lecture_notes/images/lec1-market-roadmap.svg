<rect class="box" x="1150" y="125" width="365" height="220" fill="#eadbfa" stroke="#9b8bb8"/>
<text class="heading" x="1332" y="164">BORROWERS</text><text x="1332" y="204">Governments · Companies</text><text x="1332" y="237">Loan pools</text><text x="1332" y="277">Need funding today</text><text class="small" x="1332" y="315">Cost · Maturity · Refinancing</text>
<path class="flow" d="M450 208 H580"/><path class="flow" d="M1015 208 H1145"/>
<text class="small" x="518" y="190">Funding</text><text class="small" x="1082" y="190">today</text>
