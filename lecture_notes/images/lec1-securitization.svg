<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="t d">
<title id="t">Securitization: funding at issuance and payments over time</title><desc id="d">Left: investors fund a trust that purchases existing loans from a lender and issues securities to investors. Right: borrowers pay a servicer, which transfers collections after fees to the trust for distribution to investors.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#526579"/></marker></defs>
<rect width="1400" height="800" fill="white"/>
<style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#203247;font-size:24px}.h{font-size:30px;font-weight:bold}.b{fill:#dceaff;stroke:#7b94ba;stroke-width:1.5;rx:10}.a{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#a)}.label{font-size:21px}</style>
<text class="h" x="350" y="50">Funding at issuance</text><text class="h" x="1050" y="50">Payments over time</text>
<line x1="700" y1="85" x2="700" y2="745" stroke="#d6dde5"/>
<rect class="b" style="fill:#dceaff" x="200" y="100" width="300" height="80"/><text x="350" y="149">Investors</text>
<rect class="b" style="fill:#eadbfa" x="200" y="350" width="300" height="80"/><text x="350" y="399">Trust / SPV</text>
<rect class="b" style="fill:#d9edcd" x="200" y="600" width="300" height="80"/><text x="350" y="649">Lender</text>
<path class="a" d="M275 180 V350"/><text class="label" x="170" y="250">Cash to buy</text><text class="label" x="170" y="278">securities</text>
<path class="a" d="M425 350 V180"/><text class="label" x="540" y="250">Issues securities</text><text class="label" x="540" y="278">backed by the pool</text>
<path class="a" d="M275 430 V600"/><text class="label" x="160" y="500">Cash to buy</text><text class="label" x="160" y="528">the loan pool</text>
<path class="a" d="M425 600 V430"/><text class="label" x="535" y="500">Transfers</text><text class="label" x="535" y="528">existing loans</text>
<text class="label" x="350" y="730">The lender receives funds for further lending.</text>
<rect class="b" style="fill:#fff0bf" x="900" y="100" width="300" height="80"/><text x="1050" y="149">Borrowers</text>
<rect class="b" style="fill:#ffdccc" x="900" y="280" width="300" height="80"/><text x="1050" y="329">Loan servicer</text>
<rect class="b" style="fill:#d1edf1" x="900" y="460" width="300" height="80"/><text x="1050" y="509">Trust / SPV</text>
<rect class="b" style="fill:#f4d5e3" x="900" y="640" width="300" height="80"/><text x="1050" y="689">Investors</text>
<path class="a" d="M1050 180 V280"/><text class="label" x="1210" y="235">Interest and principal</text>
<path class="a" d="M1050 360 V460"/><text class="label" x="1220" y="414">Collections after fees</text>
<path class="a" d="M1050 540 V640"/><text class="label" x="1220" y="580">Payments under</text><text class="label" x="1220" y="608">the security terms</text>
<text class="label" x="1050" y="770">Investors hold claims on the pool’s cash flows.</text>
</svg>
