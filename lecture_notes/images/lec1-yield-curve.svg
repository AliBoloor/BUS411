<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d">
<title id="t">Illustrative yield curve</title><desc id="d">Hypothetical annual yields: 1 year 3.0%, 5 years 3.6%, 10 years 4.1%, 20 years 4.5%, 30 years 4.7%. These are teaching values, not market data.</desc>
<rect width="1200" height="570" fill="#f7f5ef"/>
<g font-family="Arial,sans-serif" fill="#203247" font-size="26">
<text x="600" y="39" text-anchor="middle" font-size="29" font-weight="bold">Yields across maturities</text>
<text x="600" y="74" text-anchor="middle" font-size="21">Illustrative values, not market data</text>
<g stroke="#d6dfe3" stroke-width="1"><path d="M110 135 H1120 M110 275 H1120 M110 415 H1120"/></g>
<path d="M110 110 V465 H1120" fill="none" stroke="#526579" stroke-width="2"/>
<text x="87" y="144" text-anchor="end">5%</text><text x="87" y="284" text-anchor="end">4%</text><text x="87" y="424" text-anchor="end">3%</text>
<text x="30" y="280" transform="rotate(-90 30 280)" text-anchor="middle">Annual yield (%)</text>
<text x="615" y="550" text-anchor="middle">Term to maturity (years)</text>
<path d="M144 415 L278 331 L447 261 L783 205 L1120 177" fill="none" stroke="#176b87" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<g fill="#d7a338" stroke="#f7f5ef" stroke-width="4"><circle cx="144" cy="415" r="12"/><circle cx="278" cy="331" r="12"/><circle cx="447" cy="261" r="12"/><circle cx="783" cy="205" r="12"/><circle cx="1120" cy="177" r="12"/></g>
<g text-anchor="middle" font-weight="bold"><text x="144" y="384">3.0%</text><text x="278" y="300">3.6%</text><text x="447" y="230">4.1%</text><text x="783" y="174">4.5%</text><text x="1120" y="146">4.7%</text></g>
<g text-anchor="middle"><text x="144" y="504">1</text><text x="278" y="504">5</text><text x="447" y="504">10</text><text x="783" y="504">20</text><text x="1120" y="504">30</text></g>
</g></svg>
