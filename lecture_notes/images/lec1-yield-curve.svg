<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="530" viewBox="0 0 1050 530" role="img" aria-labelledby="t d">
<title id="t">Illustrative yield curve</title><desc id="d">A hypothetical upward-sloping curve, with maturity in years on the horizontal axis and annual yield in percent on the vertical axis. This is not market data.</desc>
<rect width="1050" height="530" fill="white"/>
<g font-family="Arial,sans-serif" font-size="25" fill="#203247">
<text x="525" y="40" text-anchor="middle">Illustrative yield curve (not market data)</text>
<path d="M110 80 V420 H975" fill="none" stroke="#526579" stroke-width="2"/>
<g stroke="#e1e5e9"><path d="M110 120 H975 M110 220 H975 M110 320 H975"/></g>
<text x="85" y="329" text-anchor="end">3%</text><text x="85" y="229" text-anchor="end">4%</text><text x="85" y="129" text-anchor="end">5%</text>
<text x="24" y="265" text-anchor="middle" transform="rotate(-90 24 265)">Annual yield (%)</text>
<text x="550" y="505" text-anchor="middle">Term to maturity (years)</text>
<text x="139" y="457" text-anchor="middle">1</text><text x="254" y="457" text-anchor="middle">5</text><text x="398" y="457" text-anchor="middle">10</text><text x="686" y="457" text-anchor="middle">20</text><text x="974" y="457" text-anchor="middle">30</text>
<path d="M139 330 C210 300 250 267 398 228 S735 169 974 145" stroke="#176b87" stroke-width="5" fill="none"/>
</g></svg>
