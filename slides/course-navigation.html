<nav id="course-topics" aria-label="Lecture topics">
  <div class="course-nav-brand">BUS 411 <span>FIXED INCOME</span></div>
  <div id="course-nav-title"></div>
  <div class="course-nav-label">LECTURE TOPICS</div>
  <ol id="course-topic-list"></ol>
  <div class="course-nav-footer"><span id="course-topic-progress"></span><span>← → navigate</span></div>
</nav>
<button id="course-topics-toggle" type="button" aria-controls="course-topics" aria-expanded="true" aria-label="Hide lecture topics">Hide topics</button>
<style>
:root { --course-nav-width: 260px; }
#course-topics { position: fixed; inset: 0 auto 0 0; width: var(--course-nav-width); box-sizing: border-box; background: #214b3e; color: #fffced; z-index: 30; display: flex; flex-direction: column; padding: 26px 16px 16px; font: 14px/1.35 "Avenir Next", "Segoe UI", sans-serif; }
.course-nav-brand { color: #e1c17d; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.course-nav-brand span { display: block; color: #c4d2bd; font-size: 10px; letter-spacing: .18em; margin-top: 5px; }
#course-nav-title { font-size: 16px; font-weight: 600; margin: 18px 0; padding-bottom: 18px; border-bottom: 1px solid #547360; }
.course-nav-label { color: #c4d2bd; font-size: 10px; letter-spacing: .16em; padding: 0 10px 10px; }
#course-topic-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: #91ab92 #214b3e; }
#course-topic-list li { margin: 0 0 3px; }
#course-topic-list button { display: grid; grid-template-columns: 23px 1fr; gap: 6px; text-align: left; width: 100%; border: 0; border-left: 3px solid transparent; padding: 9px 8px; background: transparent; color: #edf0e4; font: inherit; cursor: pointer; }
#course-topic-list button span:first-child { color: #c4d2bd; font-size: 11px; padding-top: 2px; }
#course-topic-list button:hover { background: #305d49; color: #ffffff; }
#course-topic-list button[aria-current="step"] { background: #38634d; border-left-color: #e1c17d; color: #ffffff; font-weight: 600; }
#course-topic-list button:focus-visible, #course-topics-toggle:focus-visible { outline: 2px solid #e1c17d; outline-offset: -2px; }
.course-nav-footer { display:flex; justify-content:space-between; color:#c4d2bd; font-size:11px; margin-top:14px; padding-top:12px; border-top:1px solid #547360; }
#course-topics-toggle { position: fixed; left: 272px; bottom: 10px; z-index: 40; border: 1px solid #c4cfd6; border-radius: 3px; background: #f4f3e9; color: #183b32; padding: 6px 10px; font: 12px "Avenir Next",sans-serif; cursor: pointer; }
body.course-nav-ready .reveal { position: absolute; left: var(--course-nav-width); width: calc(100% - var(--course-nav-width)); height: 100%; }
body.course-nav-hidden #course-topics { display: none; }
body.course-nav-hidden .reveal { left: 0; width: 100%; }
body.course-nav-hidden #course-topics-toggle { left: 48px; }
@media (max-width: 900px) {
  #course-topics { width: min(300px, 85vw); padding-top: 20px; box-shadow: 8px 0 30px #214b3e40; }
  body.course-nav-ready .reveal { left: 0; width: 100%; }
  #course-topics-toggle { left: auto; right: 12px; }
  body.course-nav-hidden #course-topics-toggle { left: auto; right: 12px; }
  #course-topic-list button { min-height: 44px; }
}
@media print {
  #course-topics, #course-topics-toggle { display:none!important; }
  body.course-nav-ready .reveal { left:0!important; width:100%!important; }
}
</style>
<script>
(() => {
  function initializeTopics() {
    if (!window.Reveal || !Reveal.isReady()) return;
    const nav = document.getElementById('course-topic-list');
    if (nav.children.length) return;
    const slides = Reveal.getSlides();
    const records = [];
    const title = document.querySelector('#title-slide h1');
    document.getElementById('course-nav-title').textContent = title ? title.textContent : document.title.replace(/^BUS 411\s*[—–-]\s*/, '');
    slides.forEach((slide, i) => {
      const heading = slide.querySelector('h2, h1');
      if (!heading) return;
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      const number = document.createElement('span');
      number.textContent = String(i + 1).padStart(2, '0');
      const label = document.createElement('span');
      label.textContent = heading.textContent;
      button.append(number, label);
      button.addEventListener('click', () => {
        const index = Reveal.getIndices(slide);
        Reveal.slide(index.h, index.v);
        if (matchMedia('(max-width: 900px)').matches) setHidden(true);
      });
      item.append(button); nav.append(item); records.push({slide, button});
    });
    const toggle = document.getElementById('course-topics-toggle');
    function setHidden(hidden) {
      document.body.classList.toggle('course-nav-hidden', hidden);
      toggle.setAttribute('aria-expanded', String(!hidden));
      toggle.setAttribute('aria-label', hidden ? 'Show lecture topics' : 'Hide lecture topics');
      toggle.textContent = hidden ? 'Show topics' : 'Hide topics';
      Reveal.layout();
    }
    function update() {
      const current = Reveal.getCurrentSlide();
      records.forEach(({slide, button}) => {
        if (slide === current) {
          button.setAttribute('aria-current', 'step');
          const top = button.offsetTop - nav.offsetTop;
          if (top < nav.scrollTop || top + button.offsetHeight > nav.scrollTop + nav.clientHeight) nav.scrollTop = top - nav.clientHeight / 2;
        } else button.removeAttribute('aria-current');
      });
      document.getElementById('course-topic-progress').textContent = `${slides.indexOf(current) + 1} / ${slides.length}`;
    }
    document.body.classList.add('course-nav-ready');
    toggle.addEventListener('click', () => setHidden(!document.body.classList.contains('course-nav-hidden')));
    setHidden(matchMedia('(max-width: 900px)').matches);
    Reveal.on('slidechanged', update);
    update();
  }
  if (window.Reveal && Reveal.isReady()) initializeTopics();
  else if (window.Reveal) Reveal.on('ready', initializeTopics);
  else window.addEventListener('load', initializeTopics, {once:true});
})();
</script>
