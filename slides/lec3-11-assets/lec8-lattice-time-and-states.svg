<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Time and short-rate states in a recombining lattice</title>
<desc id="desc">Time runs horizontally. The vertical axis represents the short rate. Branches connect possible next-period states. A highlighted node marks where the hold, call, or put decision is made.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#936724"/></marker></defs>
<rect width="1400" height="650" fill="#fffdf5"/>
<g font-family="Avenir Next, Segoe UI, sans-serif" fill="#214b3e">
<g stroke="#cbd3c5" stroke-width="2" stroke-dasharray="7 7"><path d="M280 100V580M620 100V580M960 100V580" fill="none"/></g>
<g stroke="#839686" stroke-width="3" fill="none"><path d="M280 300L620 180L960 80M280 300L620 420L960 520M620 180L960 300M620 420L960 300"/></g>
<g stroke="#936724" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M140 580H1190"/><path d="M140 580V55"/></g>
<g font-size="27" text-anchor="middle"><text x="280" y="622">Today</text><text x="620" y="622">t₁</text><text x="960" y="622">t₂</text><text x="1260" y="590">Time</text><text x="72" y="310" transform="rotate(-90 72 310)">Short rate</text></g>
<g fill="#e7ebdf" stroke="#214b3e" stroke-width="3"><circle cx="280" cy="300" r="43"/><circle cx="620" cy="180" r="43"/><circle cx="960" cy="80" r="43"/><circle cx="960" cy="300" r="43"/><circle cx="960" cy="520" r="43"/></g>
<circle cx="620" cy="420" r="45" fill="#f1dfb6" stroke="#936724" stroke-width="4"/>
<g font-size="29" text-anchor="middle" dominant-baseline="middle"><text x="280" y="300">r₀</text><text x="620" y="180">r₁,H</text><text x="620" y="420">r₁,L</text><text x="960" y="80">r₂,HH</text><text x="960" y="300">r₂,HL</text><text x="960" y="520">r₂,LL</text></g>
<path d="M620 235V365" stroke="#936724" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g font-size="25"><text x="410" y="285">Same date</text><text x="410" y="320">Different rates</text></g>
<path d="M666 420H1080" stroke="#936724" stroke-width="2"/>
<g font-size="27"><text x="1095" y="390">At this node:</text><text x="1095" y="430" font-weight="600">Hold, call, or put?</text></g>
</g></svg>
